# Add this site only after issuing the api-test certificate.
# Default-host rejection is provided by the existing aiaiac-api site.
server {
    listen 80;
    listen [::]:80;
    server_name api-test.aiaiacafrica.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 308 https://api-test.aiaiacafrica.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api-test.aiaiacafrica.com;
    ssl_certificate /etc/letsencrypt/live/api-test.aiaiacafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-test.aiaiacafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    if ($host != api-test.aiaiacafrica.com) { return 444; }
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host api-test.aiaiacafrica.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
