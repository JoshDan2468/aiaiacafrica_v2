# Installed as /etc/nginx/sites-available/aiaiac-api after certificate issuance.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.aiaiacafrica.com;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://api.aiaiacafrica.com$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.aiaiacafrica.com;
    ssl_certificate /etc/letsencrypt/live/api.aiaiacafrica.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.aiaiacafrica.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Reject mismatched Host even when the TLS SNI selected this virtual host.
    if ($host != api.aiaiacafrica.com) { return 444; }

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host api.aiaiacafrica.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
