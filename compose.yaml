name: aiaiac

x-api: &api
  image: ${BACKEND_IMAGE_REF:-${BACKEND_IMAGE:-aiaiac-backend}:${BACKEND_VERSION:-0.1.0}}
  build:
    context: ./backend
    args:
      VERSION: ${BACKEND_VERSION:-0.1.0}
  env_file: ${BACKEND_ENV_FILE:-./deploy/backend.env}
  environment:
    PORT: "5000"
    DATABASE_URL: postgresql://aiaiac:${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}@postgres:5432/aiaiac
    DATABASE_SSL_MODE: verify-full
    DATABASE_SSL_CA_FILE: /certs/ca.crt
    STUDENT_EVIDENCE_STORAGE_DIR: /data/evidence
    STUDENT_EVIDENCE_CLAMD_SOCKET: /run/clamav/clamd.sock
    REQUEST_AUDIT_LOG_DIR: /data/audit
  volumes:
    - database-certs:/certs:ro
    - evidence:/data/evidence
    - audit:/data/audit
    - clamd-socket:/run/clamav:ro

services:
  initialize:
    <<: *api
    user: root
    entrypoint: ["sh", "/app/docker/initialize.sh"]
    volumes:
      - database-certs:/certs
      - evidence:/data/evidence
      - audit:/data/audit
    restart: "no"

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: aiaiac
      POSTGRES_DB: aiaiac
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD in .env}
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/certs/server.crt", "-c", "ssl_key_file=/certs/server.key"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - database-certs:/certs:ro
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiaiac -d aiaiac"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    volumes:
      - clamav-data:/var/lib/clamav
      - clamd-socket:/tmp
    # Official image creates /tmp/clamd.sock and runs freshclam.
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  migrate:
    <<: *api
    command: ["node", "docker/migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *api
    init: true
    ports:
      - "127.0.0.1:${BACKEND_PORT:-5000}:5000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 20s

volumes:
  postgres-data:
  database-certs:
  evidence:
  audit:
  clamav-data:
  clamd-socket:
